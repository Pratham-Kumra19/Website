<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Arc for LOVELY PROFESSIONAL UNIVERSITY -->
    <path id="lpuTopArc" d="M 68,250 A 182,182 0 1,1 432,250" fill="none" />
    <!-- Arc for PUNJAB (INDIA) -->
    <path id="lpuBottomArc" d="M 98,340 A 182,182 0 0,0 402,340" fill="none" />
    
    <!-- Clip path for the inner circle -->
    <clipPath id="innerDiscClip">
      <circle cx="250" cy="250" r="162" />
    </clipPath>
  </defs>

  <!-- Outer ring background -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" stroke="#000000" stroke-width="12" />

  <!-- Top Text: LOVELY PROFESSIONAL UNIVERSITY -->
  <text font-family="'Century Gothic', 'Montserrat', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="27" fill="#000000" letter-spacing="3.2">
    <textPath href="#lpuTopArc" startOffset="50%" text-anchor="middle">
      LOVELY PROFESSIONAL UNIVERSITY
    </textPath>
  </text>

  <!-- Left & Right Separator Dots -->
  <circle cx="85" cy="358" r="8.5" fill="#000000" />
  <circle cx="415" cy="358" r="8.5" fill="#000000" />

  <!-- Bottom Text: PUNJAB (INDIA) -->
  <text font-family="'Century Gothic', 'Montserrat', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="28" fill="#000000" letter-spacing="4.5">
    <textPath href="#lpuBottomArc" startOffset="50%" text-anchor="middle">
      PUNJAB (INDIA)
    </textPath>
  </text>

  <!-- Inner circular disc -->
  <circle cx="250" cy="250" r="162" fill="#E86A17" stroke="#000000" stroke-width="8" />

  <!-- Dynamic Sunburst Black Rays (as seen in LPU emblem) -->
  <g clip-path="url(#innerDiscClip)">
    <!-- Ray 1: Leftmost steeply ascending -->
    <polygon points="120,400 152,400 108,100 88,100" fill="#000000" />
    <!-- Ray 2 -->
    <polygon points="125,400 162,400 178,90 152,90" fill="#000000" />
    <!-- Ray 3: Center-left beam fanning to top-right -->
    <polygon points="135,400 178,400 285,90 238,90" fill="#000000" />
    <!-- Ray 4: Upper-right beam -->
    <polygon points="145,400 190,400 375,140 338,125" fill="#000000" />
    <!-- Ray 5: Rightward beam -->
    <polygon points="152,400 200,400 415,245 378,225" fill="#000000" />
    <!-- Ray 6: Lower-right beam -->
    <polygon points="160,400 208,400 415,350 370,335" fill="#000000" />
  </g>

  <!-- Inner circle border to ensure crisp overlay on rays -->
  <circle cx="250" cy="250" r="162" fill="none" stroke="#000000" stroke-width="8" />
</svg>
